<svg xmlns="http://www.w3.org/2000/svg" width="300" height="262" viewBox="0 0 300 262">
  <defs>
    <clipPath id="ic"><rect width="300" height="169" rx="14"/><rect y="20" width="300" height="149"/></clipPath>
    <linearGradient id="jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e2b"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
      .sans { font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif; }
      .fade { opacity: 0; animation: fade 3s infinite; }
      @keyframes fade { 0% { opacity: 0; } 16.7% { opacity: 1; } 100.0% { opacity: 1; } 116.7% { opacity: 0; } 100% { opacity: 0; } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; opacity: 0; }
      @keyframes ring { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(3.2); opacity: 0; } }
      .orbit { animation: orbit 8s linear infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      .eq { animation: eq 1s ease-in-out infinite alternate; }
      @keyframes eq { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="261" rx="14" fill="#14110e" stroke="#5a4636" stroke-opacity="0.9"/>
  <g clip-path="url(#ic)"><image href="data:image/jpeg;base64," width="300" height="169" preserveAspectRatio="xMidYMid slice"/></g>
  <rect x="10" y="10" width="63.0" height="20" rx="10" fill="#0b0f14" fill-opacity="0.78"/><text x="41.5" y="24" text-anchor="middle" class="sans" font-size="10.5" fill="#e5e7eb">Archived</text>
  <text x="14" y="196" class="sans" font-size="16" font-weight="800" fill="#e8dcc8">A solvable sheep game</text>
  <text x="286" y="195" text-anchor="end" class="mono" font-size="11" fill="#c4a57a">2022 ★ 409</text>
  <text x="14" y="217" class="sans" font-size="11.5" fill="#a89880">A tile-matching game with custom themes</text>
  <rect x="14.0" y="230" width="71.8" height="22" rx="11" fill="#221c17"/><text x="49.9" y="245" text-anchor="middle" class="sans" font-size="12" fill="#b8a48a">React 18</text><rect x="91.8" y="230" width="44.9" height="22" rx="11" fill="#221c17"/><text x="114.2" y="245" text-anchor="middle" class="sans" font-size="12" fill="#b8a48a">Vite</text>
  <rect x="225.7" y="230" width="62.3" height="22" rx="11" fill="#5a4636"/><text x="256.8" y="245" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff">▶ Live</text>
</svg>
