<svg xmlns="http://www.w3.org/2000/svg" width="300" height="262" viewBox="0 0 300 262">
  <defs>
    <clipPath id="ic"><rect width="300" height="169" rx="14"/><rect y="20" width="300" height="149"/></clipPath>
    <linearGradient id="jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e2b"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
      .sans { font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif; }
      .fade { opacity: 0; animation: fade 3s infinite; }
      @keyframes fade { 0% { opacity: 0; } 16.7% { opacity: 1; } 100.0% { opacity: 1; } 116.7% { opacity: 0; } 100% { opacity: 0; } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; opacity: 0; }
      @keyframes ring { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(3.2); opacity: 0; } }
      .orbit { animation: orbit 8s linear infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      .eq { animation: eq 1s ease-in-out infinite alternate; }
      @keyframes eq { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="261" rx="14" fill="#0b0f14" stroke="#f472b6" stroke-opacity="0.45"/>
  <g clip-path="url(#ic)"><image href="data:image/jpeg;base64," width="300" height="169" preserveAspectRatio="xMidYMid slice"/></g>
  
  <text x="14" y="196" class="sans" font-size="16" font-weight="800" fill="#ffffff">Hold'em trainer</text>
  <text x="286" y="195" text-anchor="end" class="mono" font-size="11" fill="#fdba74">2025 ★ 7</text>
  <text x="14" y="217" class="sans" font-size="11.5" fill="#d1d5db">WebRTC multiplayer, mostly AI-written</text>
  <rect x="14.0" y="230" width="65.0" height="22" rx="11" fill="#1f2937"/><text x="46.5" y="245" text-anchor="middle" class="sans" font-size="12" fill="#e5e7eb">Vue 3.5</text><rect x="85.0" y="230" width="58.3" height="22" rx="11" fill="#1f2937"/><text x="114.2" y="245" text-anchor="middle" class="sans" font-size="12" fill="#e5e7eb">WebRTC</text>
  <rect x="225.7" y="230" width="62.3" height="22" rx="11" fill="#be185d"/><text x="256.8" y="245" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff">▶ Live</text>
</svg>
